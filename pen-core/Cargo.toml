[package]
name = "pen-core"
version = "0.1.0"
edition = "2021"

# Shared by the controller (and, later, the existing Tauri overlay). No UI toolkit in here:
#   lifecycle  - the show/hide rules as a pure state machine (testable on any OS)
#   pen_win    - Windows pen presence and real-mouse detection (Raw Input + a low-level mouse hook)
[dependencies]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_WindowsAndMessaging",
] }
