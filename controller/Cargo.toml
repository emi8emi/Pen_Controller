[package]
name = "controller"
version = "0.1.0"
edition = "2021"

# Versions are pinned on purpose: winit changes its API between releases.
# The ink (brush engine + wgpu renderer) lives in pen-ink; pen input and window styles in pen-core.
# No direct `windows` dependency any more: input_win.rs only needs winit and pen-core.
[dependencies]
pen-proto = { path = "../pen-proto" }
pen-core = { path = "../pen-core" }
pen-ink = { path = "../pen-ink" }
winit = "0.30"
global-hotkey = "0.8"
tray-icon = "0.26"
