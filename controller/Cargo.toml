[package]
name = "controller"
version = "0.1.0"
edition = "2021"

# Versions are pinned on purpose: winit changes its API between releases.
# The ink (brush engine + wgpu renderer) lives in pen-ink; pen input and window styles in pen-core.
# No direct `windows` dependency any more: input_win.rs only needs winit and pen-core.
[dependencies]
pen-proto = { path = "../pen-proto" }
pen-core = { path = "../pen-core" }
pen-ink = { path = "../pen-ink" }
winit = "0.30"
global-hotkey = "0.8"
# Config window. egui 0.37 needs wgpu 30 and winit 0.30, the same as pen-ink and this crate.
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = { version = "0.37", features = ["winit"] }
egui-winit = { version = "0.37", default-features = false, features = ["wayland", "x11"] }
pollster = "0.4"

# The tray exists on Windows only (tray-icon pulls in GTK on Linux, which nothing here uses).
[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
