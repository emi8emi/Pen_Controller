[package]
name = "controller"
version = "0.1.0"
edition = "2021"

# Versions are pinned on purpose: winit and windows change their APIs between releases.
# The ink (brush engine + wgpu renderer) lives in pen-ink now.
[dependencies]
pen-proto = { path = "../pen-proto" }
pen-core = { path = "../pen-core" }
pen-ink = { path = "../pen-ink" }
winit = "0.30"
global-hotkey = "0.8"
tray-icon = "0.26"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
